<html>
    <head>
        <title> Phiếu đăng ký tham gia trương trình khuyến mãi</title>
    </head>
    <body>

        <div style="width: 550px; border: 1px solid grey; padding: 15px; background-color: white;">
            <h2 align="center" style="color: green; margin-top: 5px">Phiếu đăng ký tham gia chương trình khuyến mãi</h2>
            
            <table border="1" cellpadding="5" cellspacing="0" style="width: 100%; border: 1.5px solid green; background-color: lightgreen;">
                <tr>
                    <td style="border: 1px solid green; width: 38%;">Họ và tên</td>
                    <td style="border: 1px solid green;">
                        <input type="text" value="Nguyễn Ngọc Quỳnh Nga" style="width: 90%;">
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid green;">Địa chỉ</td>
                    <td style="border: 1px solid green;">
                        <input type="text" value="2Bia Hùng Vương, Q10" style="width: 70%;">
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid green;">Điện thoại</td>
                    <td style="border: 1px solid green;">
                        <input type="text" value="0909097506" style="width: 50%;">
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid green;">Phái</td>
                    <td style="border: 1px solid green;">
                        <input type="radio" name="gioitinh" id="nam"> <label for="nam">Nam</label>
                        &nbsp;&nbsp;
                        <input type="radio" name="gioitinh" id="nu" checked> <label for="nu">Nữ</label>
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid green;">Nghề nghiệp</td>
                    <td style="border: 1px solid green;">
                        <select>
                            <option selected>Giáo viên</option>
                            <option>Bác sĩ</option>
                            <option>Kỹ sư</option>
                            <option>Sinh viên</option>
                            <option>...</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid green;">Chọn sản phẩm tham gia</td>
                    <td style="border: 1px solid green;">
                        <select multiple size="4" style="width: 150px;">
                            <option selected>Kem đánh răng</option>
                            <option>Bột giặt</option>
                            <option>Dầu gội đầu</option>
                            <option>Sữa tắm</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid green;">Số người dự đoán tham gia</td>
                    <td style="border: 1px solid green;">
                        <input type="text" value="250000" style="width: 30%;">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center" style="border: 1px solid green">
                        <input type="submit" value="Đồng ý" style="cursor: pointer">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center" style="border: 1px solid green; color: red; font-size: 15px">
                        Bạn đã đăng ký thành công!!!
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
