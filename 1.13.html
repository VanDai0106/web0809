<html>
    <head>
        <title>Đăng ký du lịch</title>
    </head>
    <body>
        <div style="width: 520px; border: 1px solid grey">
            <h2 align="center" style="color: blue; margin-bottom: 15px;">Đăng ký du lịch</h2>

            <!-- Bảng thông tin đăng ký -->
            <table border="1" style="width: 100%; border: 1.5px solid #8a883b; background-color: #fffde0;">
                <tr>
                    <td style="border: 1px solid #8a883b; width: 32%;">Họ và tên</td>
                    <td style="border: 1px solid #8a883b;">
                        <input type="text" value="Phạm Ngọc Cẩm Đào" style="width: 92%;">
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid #8a883b;">Địa chỉ</td>
                    <td style="border: 1px solid #8a883b;">
                        <input type="text" value="227 Nguyễn Văn Cừ" style="width: 60%;">
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid #8a883b;">Điện thoại</td>
                    <td style="border: 1px solid #8a883b;">
                        <input type="text" value="8351056" style="width: 45%;">
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid #8a883b;">Khách Việt Nam</td>
                    <td style="border: 1px solid #8a883b;">
                        <input type="checkbox" checked>
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid #8a883b;">Chọn tour</td>
                    <td style="border: 1px solid #8a883b;">
                        <select>
                            <option>Buôn mê thuột - Gia lai - Kontum</option>
                            <option>Đà Nẵng - Huế</option>
                            <option>Nha Trang - Đà Lạt</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid #8a883b;">Phương tiện</td>
                    <td style="border: 1px solid #8a883b;">
                        <input type="radio" name="phuongtien" id="maybay">
                        <label for="maybay">Máy bay</label>
                        &nbsp;&nbsp;
                        <input type="radio" name="phuongtien" id="oto" checked>
                        <label for="oto">Xe ô tô</label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="border: 1px solid #8a883b">
                        <fieldset style="border: 1.5px solid #732200; padding: 6px 10px; margin: 2px 0;">
                            <legend style="color: #732200; font-style: italic; margin-left: 5px;">Số lượng đoàn khách</legend>
                            <div align="center">
                                Người lớn <input type="text" value="6" style="width: 50px; margin-right: 20px;">
                                Trẻ em <input type="text" value="4" style="width: 50px;">
                            </div>
                        </fieldset>
                    </td>
                </tr>

                <tr>
                    <td style="border: 1px solid #8a883b;">Ghi chú thêm</td>
                    <td style="border: 1px solid #8a883b;">
                        <textarea rows="2" style="width: 85%;">Có 2 trẻ em dưới 6 tuổi&#10;Có 2 người ăn chay</textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center" style="border: 1px solid #8a883b">
                        <input type="submit" value="Đồng ý" style="cursor: pointer;">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center" style="border: 1px solid #8a883b; color: #d46b08">
                        Bạn đã đăng ký thành công!!!
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
